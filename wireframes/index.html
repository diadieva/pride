<!doctype html>
<!--
  Огляд вайрфреймів — пункт «Екрани» в навігаторі. Це сторінка репо, не екран продукту: рамки .device тут немає.
  Групи, екрани й стани не дублюються руками, а будуються з гілки «Екрани» в _nav/tree.js
  (вона, своєю чергою, дослівно повторює реєстр sitemap.md). Новий екран у tree.js з'являється тут сам.
-->
<html lang="uk" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прайд · Екрани</title>
  <script src="../_nav/theme.js"></script>
  <link rel="stylesheet" href="../_nav/theme.css">
  <link rel="stylesheet" href="../_nav/icons.css">
  <link rel="stylesheet" href="../_nav/nav.css">
  <script defer src="../_nav/tree.js"></script>
  <script defer src="../_nav/nav.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-underline-offset: 2px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 96px; }
    @media (min-width: 900px) { main { padding: 48px 40px 120px; } }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px; }
    h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.08; letter-spacing: -.02em; margin: 0 0 12px; }
    .lead { color: var(--muted); max-width: 720px; margin: 0; font-size: 16px; }
    .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; padding: 0; list-style: none; }
    .toc a { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); text-decoration: none; font-size: 13px; }
    .toc a:hover { border-color: var(--accent); }

    section { padding-top: 48px; scroll-margin-top: 8px; }
    section > h2 { font-size: clamp(22px, 4vw, 28px); letter-spacing: -.01em; margin: 0 0 16px; display: flex; align-items: baseline; gap: 12px; }
    section > h2 .num { color: var(--accent); font-size: .6em; font-weight: 700; letter-spacing: .08em; }

    .screens { display: grid; gap: 12px; }
    @media (min-width: 760px) { .screens { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1100px) { .screens { grid-template-columns: repeat(3, 1fr); } }
    /* Уся картка веде на базову сторінку екрана; чипи станів — окремі посилання поверх неї */
    .screen { position: relative; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-radius: var(--radius); padding: 18px; transition: background .15s ease; }
    .screen:hover { background: color-mix(in srgb, var(--surface) 60%, var(--surface-2)); }
    @media (prefers-reduced-motion: reduce) { .screen { transition: none; } }
    .screen-ic { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--surface-raised); color: var(--text); }
    .screen-ic .i { width: 18px; height: 18px; vertical-align: 0; }
    .screen h3 { margin: 0; font-size: 17px; line-height: 1.3; }
    .screen h3 a { color: var(--text); text-decoration: none; }
    .screen h3 a::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
    .screen h3 a:focus-visible { outline: none; }
    .screen h3 a:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
    .screen:hover h3 a { text-decoration: underline; text-underline-offset: 3px; }
    .file { color: var(--muted); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .states { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .states a { display: inline-block; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text); font-size: 12.5px; text-decoration: none; }
    .states a:hover { background: var(--accent-soft); }
    .none { color: var(--muted); font-size: 13px; }
    noscript p { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <header class="hero">
    <p class="eyebrow">Прайд · вайрфрейми</p>
    <h1>Екрани</h1>
    <p class="lead">Усі екрани з реєстру <a href="https://github.com/diadieva/pride/blob/main/sitemap.md#екрани">sitemap.md</a>, згруповані так само. Кожен — у рамці телефона 390 px; під назвою — його стани. Правила — <a href="https://github.com/diadieva/pride/blob/main/wireframes/_conventions.md">_conventions.md</a>.</p>
    <ul class="toc" id="toc"></ul>
  </header>
  <div id="groups"></div>
  <noscript><p>Список будується з навігатора й потребує JavaScript. Екрани є в навігаторі зліва.</p></noscript>
</main>
<script>
  // Будує огляд з гілки «Екрани» в _nav/tree.js (tree.js підключено з defer, тож він уже виконався).
  // Назви станів — короткі й у тому ж порядку, що й вкладки над рамкою екрана (_nav/nav.js)
  var STATES = [["порожн", "Порожній"], ["помилк", "Помилка"], ["завантаж", "Завантаження"], ["успіх", "Успіх"]];
  document.addEventListener("DOMContentLoaded", function () {
    var branch = (window.NAV_TREE || []).filter(function (i) { return i.title === "Екрани"; })[0];
    if (!branch) return;
    var root = "../", toc = document.getElementById("toc"), out = document.getElementById("groups");
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }
    branch.children.forEach(function (group, gi) {
      var id = "group-" + (gi + 1);
      var li = el("li"), a = el("a", "", (gi + 1) + " · " + group.title);
      a.href = "#" + id;
      li.appendChild(a);
      toc.appendChild(li);

      var sec = el("section");
      sec.id = id;
      var h2 = el("h2");
      h2.appendChild(el("span", "num", String(gi + 1).padStart(2, "0")));
      h2.appendChild(document.createTextNode(" " + group.title));
      sec.appendChild(h2);
      var grid = el("div", "screens");
      (group.children || []).forEach(function (screen) {
        var card = el("article", "screen");
        var ic = el("span", "screen-ic"), i = el("span", "i i-" + (screen.icon || "mobile"));
        i.setAttribute("aria-hidden", "true");
        ic.appendChild(i);
        card.appendChild(ic);
        var h3 = el("h3"), link = el("a", "", screen.title);
        link.href = root + screen.href;
        h3.appendChild(link);
        card.appendChild(h3);
        card.appendChild(el("span", "file", screen.href.split("/").pop()));
        var states = [];
        STATES.forEach(function (st) {
          var hit = (screen.children || []).filter(function (c) { return c.href && c.title.toLowerCase().indexOf(st[0]) === 0; })[0];
          if (hit) states.push({ label: st[1], href: hit.href });
        });
        if (states.length) {
          var ul = el("ul", "states");
          ul.setAttribute("aria-label", "Стани екрана «" + screen.title + "»");
          states.forEach(function (st) {
            var sli = el("li"), sa = el("a", "", st.label);
            sa.href = root + st.href;
            sli.appendChild(sa);
            ul.appendChild(sli);
          });
          card.appendChild(ul);
        } else {
          card.appendChild(el("span", "none", "Окремих станів немає"));
        }
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      out.appendChild(sec);
    });
  });
</script>
</body>
</html>
